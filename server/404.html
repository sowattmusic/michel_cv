<style>
:root { --nuit: #070b18; --texte: #e9ecf5; --texte-doux: #a3abc4; --rouge: #e5373a; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding-inline: 16px; text-align: center;
  background: radial-gradient(60rem 40rem at 50% -10%, #141d38, var(--nuit)); color: var(--texte);
  font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { display: grid; gap: 16px; justify-items: center; }
.code { margin: 0; font: 700 .78rem/1 Inter, system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--rouge); }
h1 { margin: 0; font: 600 clamp(1.6rem, 5vw, 2.2rem)/1.1 "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -.01em; }
p { margin: 0; color: var(--texte-doux); }
a { display: inline-block; margin-top: 8px; padding: 14px 24px; border-radius: 999px; background: var(--rouge); color: #fff; text-decoration: none; font-weight: 600; }
a:hover { background: #b9232a; }
a:focus-visible { outline: 2px solid #8fb0ff; outline-offset: 3px; }
</style>
</head>

<main>
  <p class="code">Erreur 404</p>
